                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin: 16px 0 18px;">
                  <tr>
                    <td align="center" style="border: 2px dashed #1F4535; border-radius: 20px; padding: 18px 10px 14px;">
                      <div style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #4A5D54;">Your code</div>
                      <div class="code" style="font-size: 40px; line-height: 50px; font-weight: 700; letter-spacing: 8px; color: #1F4535; padding: 2px 0 0 8px;">{{ .Token }}</div>
                      <div style="font-size: 14px; line-height: 20px; color: #4A5D54;">Works once, for the next 10 minutes.</div>
                    </td>
                  </tr>
                </table>
