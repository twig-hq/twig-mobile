<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light only" />
    <title>%TITLE%</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" />
    <style>
      :root { color-scheme: light only; }
      body { margin: 0; padding: 0; background: #F7F1E6; }
      img { border: 0; display: block; }
      @media (max-width: 480px) {
        .pad { padding-left: 22px !important; padding-right: 22px !important; }
        .code { font-size: 34px !important; letter-spacing: 6px !important; }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background: #F7F1E6;">
    <!-- what the inbox shows next to the subject -->
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0; color: #F7F1E6;">%PREHEADER%</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #F7F1E6;">
      <tr>
        <td align="center" style="padding: 22px 14px 36px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 500px;">
            <tr>
              <!-- the letter: a sheet of paper -->
              <td class="pad" style="background: #FFFDF8; border: 1px solid #EADFCB; border-radius: 10px; box-shadow: 0 10px 24px rgba(60, 40, 20, 0.1); padding: 20px 28px 28px; font-family: 'Figtree', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1F4535;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td valign="top" style="padding-top: 4px;">
                      <img src="%IMAGES%/lockup.png" width="98" height="38" alt="Twig" style="width: 98px; height: 38px;" />
                    </td>
                    <td valign="top" align="right" width="140">
                      <img src="%IMAGES%/stamp.png" width="140" height="108" alt="A postage stamp with a thumbprint bird on it, postmarked Twig." style="width: 140px; height: 108px;" />
                    </td>
                  </tr>
                </table>
                <!-- on its own line so it never wraps beside the stamp on a phone -->
                <p style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 26px; line-height: 34px; color: #1F4535;">%GREETING%</p>
%BODY%
                <p style="margin: 22px 0 4px; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 22px; line-height: 30px; color: #1F4535;">%CLOSING%</p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td valign="bottom"><img src="%IMAGES%/sign.png" width="140" height="57" alt="Three thumbprint birds: one with a flower, one with a hat, one with headphones." style="width: 140px; height: 57px;" /></td>
                    <td valign="bottom" style="padding: 0 0 12px 10px; font-size: 14px; line-height: 20px; color: #4A5D54;">all of us at Twig</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 20px 22px 0; font-family: 'Figtree', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; line-height: 19px; color: #4A5D54;">
                You got this because someone typed {{ .Email }} into the Twig app. If that wasn't you, ignore this email and nothing happens.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
