name: Database

# Runs every migration on a fresh local Supabase stack (the same images as the
# hosted project, Postgres 17) and then the pgTAP suite in supabase/tests.
#
# It runs on every pull request so it can be a required check: when a pull
# request touches nothing database-related, the job reports success without
# starting Supabase.
#
# On main, once the tests pass, new migrations go to the hosted projects in
# order: first Twig Dev (the "dev" environment), then, only if that worked,
# Twig (the "production" environment). Only main can use either environment.
# Each needs SUPABASE_PROJECT_REF (variable) and SUPABASE_ACCESS_TOKEN (secret):
# a scoped Supabase access token with database_write,
# database_pooling_config_read and projects_read. No database password is
# stored in GitHub. See docs/supabase.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Newer pushes cancel older runs on pull requests, never on main, so a deploy
# is never cut off halfway.
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Migrations and pgTAP tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did database files change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF...HEAD" \
               | grep -qE '^(supabase/|\.github/workflows/database\.yml$)'; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"
            echo "No database changes; skipping."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.db == 'true'
        with:
          version: 3.1.0

      - name: Start Supabase (applies every migration)
        if: steps.changes.outputs.db == 'true'
        run: supabase start

      - name: Run pgTAP tests
        if: steps.changes.outputs.db == 'true'
        run: supabase test db

      - name: Stop Supabase
        if: always() && steps.changes.outputs.db == 'true'
        run: supabase stop --no-backup

  # Twig Dev first: a migration that fails on a database with data in it
  # stops here, before production.
  deploy-dev:
    name: Deploy migrations to Twig Dev
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    concurrency:
      group: supabase-dev
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Check the dev settings are present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN (secret) and SUPABASE_PROJECT_REF (variable) on the dev environment."
            exit 1
          fi

      - name: Migrations that will be applied
        run: supabase db push --remote="$PROJECT_REF" --dry-run

      - name: Apply migrations
        run: supabase db push --remote="$PROJECT_REF" --yes

  deploy:
    name: Deploy migrations to Twig (production)
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Check the production settings are present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN (secret) and SUPABASE_PROJECT_REF (variable) on the production environment."
            exit 1
          fi

      - name: Migrations that will be applied
        run: supabase db push --remote="$PROJECT_REF" --dry-run

      - name: Apply migrations
        run: supabase db push --remote="$PROJECT_REF" --yes
