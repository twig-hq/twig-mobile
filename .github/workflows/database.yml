name: Database

# Runs every migration on a fresh local Supabase stack (the same images as the
# hosted project, Postgres 17) and then the pgTAP suite in supabase/tests.
on:
  pull_request:
    paths:
      - "supabase/**"
      - "src/lib/database.types.ts"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "src/lib/database.types.ts"
      - ".github/workflows/database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations and pgTAP tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Start Supabase (applies every migration)
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db

      - name: Generated types match the schema
        # The PostgREST version line differs between the local stack and the
        # hosted project, so it is left out of the comparison.
        run: |
          supabase gen types typescript --schema public > /tmp/database.types.ts
          if ! diff -u <(grep -v PostgrestVersion src/lib/database.types.ts) <(grep -v PostgrestVersion /tmp/database.types.ts); then
            echo "::error::src/lib/database.types.ts is out of date. Run: npx supabase gen types typescript --remote --schema public > src/lib/database.types.ts"
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
